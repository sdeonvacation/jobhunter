spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/jobhunter
    username: ${DB_USER:jobhunter}
    password: ${DB_PASSWORD:jobhunter}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  quartz:
    job-store-type: memory
  liquibase:
    change-log: classpath:db/changelog/master.xml

quartz:
  startup-jitter-max-seconds: ${JOBHUNTER_STARTUP_JITTER_MAX_SECONDS:30}

ai:
  provider: ${JOBHUNTER_AI_PROVIDER:anthropic}
  api-key: ${JOBHUNTER_AI_API_KEY:}
  base-url: ${JOBHUNTER_AI_BASE_URL:}
  extraction-model: ${JOBHUNTER_AI_EXTRACTION_MODEL:claude-haiku-4-5}
  tailoring-model: ${JOBHUNTER_AI_TAILORING_MODEL:claude-sonnet-4-5}
  fallback:
    provider: ${JOBHUNTER_AI_FALLBACK_PROVIDER:openai}
    api-key: ${JOBHUNTER_AI_FALLBACK_API_KEY:}
    base-url: ${JOBHUNTER_AI_FALLBACK_BASE_URL:}
    extraction-model: ${JOBHUNTER_AI_FALLBACK_EXTRACTION_MODEL:gemini-2.0-flash-lite}
    tailoring-model: ${JOBHUNTER_AI_FALLBACK_TAILORING_MODEL:gemini-2.0-flash}

ai-crawl:
  schedule: "0 20 */8 * * ?"
  frequency-hours: 8
  batch-size: 150
  max-content-chars: 8000
  enabled: ${AI_CRAWL_ENABLED:true}

crawl:
  concurrency: 20

pipeline:
  schedule: "0 0 */4 * * ?"
  timeout-seconds: 30

indeed:
  npx-path: /opt/homebrew/bin/npx

discovery:
  auto-endpoint:
    enabled: true
  schedule: "0 40 */6 * * ?"
  resolve-limit: 50
  providers:
    jobspy:
      enabled: true
      keywords: ["backend engineer", "java", "AI Engineer", "Software Developer"]
      locations: ["Germany", "Netherlands", "Austria", "Belgium", "Czechia", "Denmark", "Finland", "France", "Greece", "Hungary", "Ireland", "Italy", "Luxembourg", "Poland", "Portugal", "Romania", "Spain", "Sweden", "Switzerland", "remote"]
    stepstone:
      enabled: true
      postal-codes: ["10115", "80331", "20095", "60311", "50667", "8001", "1201", "4001", "3001", "1000"]
    linkedin-alerts:
      enabled: false
    linkedin:
      enabled: ${LINKEDIN_MCP_ENABLED:true}
      keywords: ["backend engineer", "java", "AI Engineer", "Software Developer"]
      locations: ["Germany", "Netherlands", "Italy", "Sweden", "Finland", "Poland", "Switzerland", "Estonia", "remote", "Austria", "Denmark", "Spain", "France", "Belgium", "Portugal", "Czechia", "Hungary", "Romania", "Greece", "Luxembourg", "Malta", "Croatia", "Slovenia", "Slovakia", "Bulgaria", "Lithuania", "Latvia", "Cyprus", "Ireland"]

linkedin-mcp:
  enabled: ${LINKEDIN_MCP_ENABLED:true}
  base-url: ${LINKEDIN_MCP_URL:http://127.0.0.1:8000}
  path: /mcp
  timeout-seconds: 30
  rate-limit:
    search-per-hour: 20
    profile-per-hour: 15
    action-per-hour: 10
    total-per-hour: 50
  circuit-breaker:
    failure-threshold: 3
    cooldown-minutes: 60
  enrichment:
    enabled: true
    batch-size: 10
    delay-between-ms: 3000
  recruiter-post-check:
    enabled: true
    max-calls: 6
    ttl-days: 7
    ai-verification-enabled: true
    recency-window: all          # "all" = no date filter (sidecar supports past-24h/past-week/past-month)
    automated:
      enabled: false
      top-n: 10
      daily-call-budget: 40
      slim-mode: true

resolution:
  google-search:
    api-key: ${GOOGLE_SEARCH_API_KEY:}
    cx: ${GOOGLE_SEARCH_CX:}
  strategies-order: [PATTERN_MATCH, GOOGLE_SEARCH, REDIRECT_FOLLOW]
  timeout-seconds: 15

scoring:
  schedule: "0 30 7,13,19 * * ?"
  opportunity-weights:
    match-score: 0.30
    interview-history: 0.20
    salary: 0.20
    company-quality: 0.15
    seniority: 0.10
    location-fit: 0.05

digest:
  schedule: "0 30 7 * * ?"

gdpr:
  recruiter-ttl-days: 90
  purge-schedule: "0 0 2 * * ?"

stuck-job-janitor:
  schedule: "0 0 4 * * ?"

# visa-reaper:
#   schedule: "0 0 */6 * * ?"  # default: every 6h

aggregator:
  enrichment:
    enabled: true
    batch-size: 5
    delay-between-ms: 2000
    min-description-length: 500
  sources:
    # Note: frequency-hours is stored for reference only — not used for gating.
    # PipelineScheduler runs all sources on every pipeline tick (see pipeline.schedule).
    - name: berlinstartupjobs
      strategy: ai
      job-source: BERLIN_STARTUP_JOBS
      discovery-source: BERLIN_STARTUP_JOBS
      url: "https://berlinstartupjobs.com/engineering/"
      frequency-hours: 12 # informational only
      max-results: 30
    - name: arbeitnow
      strategy: rest-api
      job-source: ARBEITNOW
      discovery-source: ARBEITNOW
      url: "https://www.arbeitnow.com/api/job-board-api"
      frequency-hours: 6 # informational only
      max-results: 50
    - name: careersingothenburg
      strategy: meilisearch
      job-source: CAREERS_IN_GOTHENBURG
      discovery-source: CAREERS_IN_GOTHENBURG
      url: "https://search-movetogbg.tenfifty.io"
      frequency-hours: 12 # informational only
      max-results: 200
      visa-exempt: true
      config:
        apiKey: "d0f1115ce0f71a8d890b7733f4e3e15c8e03682666eb72e320efb61a46cfda4c"
        index: "jobs"
        filter: "language = \"en\""
    - name: instaffo
      strategy: instaffo
      job-source: INSTAFFO
      discovery-source: INSTAFFO
      url: "https://jobs.instaffo.com/sitemap-jobs.xml"
      frequency-hours: 8 # informational only
      max-results: 50
      visa-exempt: true
      config:
        delayBetweenMs: "400"
        maxScrapePerRun: "50"
    - name: builtineurope
      strategy: builtineurope
      job-source: BUILTIN_EUROPE
      discovery-source: BUILTIN_EUROPE
      url: "https://api.builtineurope.com/search"
      frequency-hours: 6 # informational only
      max-results: 500
      config:
        queries: "engineer,developer"
    - name: jobgether-backend
      strategy: jobgether
      job-source: JOBGETHER
      discovery-source: JOBGETHER
      url: "https://jobgether.com/remote-jobs/germany/backend-engineer"
      frequency-hours: 8 # informational only
      max-results: 200
      visa-exempt: true
    - name: jobgether-java
      strategy: jobgether
      job-source: JOBGETHER
      discovery-source: JOBGETHER
      url: "https://jobgether.com/remote-jobs/germany/java-developer"
      frequency-hours: 8 # informational only
      max-results: 200
      visa-exempt: true
    - name: jobgether-software
      strategy: jobgether
      job-source: JOBGETHER
      discovery-source: JOBGETHER
      url: "https://jobgether.com/remote-jobs/germany/software-engineer"
      frequency-hours: 8 # informational only
      max-results: 200
      visa-exempt: true
    - name: stepstone
      strategy: stepstone
      job-source: STEPSTONE
      discovery-source: STEPSTONE
      url: "https://www.stepstone.de"
      frequency-hours: 12
      max-results: 100
      config:
        queries: "java developer,backend engineer,software engineer,kotlin developer"
        cities: "berlin,muenchen,hamburg,frankfurt-am-main,koeln"
        delayBetweenMs: "1500"
        maxScrapePerRun: "40"
        maxConsecutiveDetailFailures: "3"
    - name: workinfinland
      strategy: workinfinland
      job-source: WORK_IN_FINLAND
      discovery-source: WORK_IN_FINLAND
      url: "https://www.workinfinland.com/api/jobs/"
      frequency-hours: 12 # informational only
      max-results: 800
      visa-exempt: true
      config:
        categories: "software-development,ict,deep-tech,engineering"
        limit: "50"
        delayBetweenPagesMs: "500"
    - name: visajobs
      strategy: visajobs
      job-source: VISAJOBS
      discovery-source: VISAJOBS
      url: "https://svupfnfszawowpkqhwdn.supabase.co/rest/v1/jobs"
      frequency-hours: 12 # informational only
      max-results: 2000
      visa-exempt: true
      config:
        apikey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN2dXBmbmZzemF3b3dwa3Fod2RuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTEyNjYsImV4cCI6MjA5OTA2NzI2Nn0.GM9Uq_-ruw3Hvs94WDNzg0oMv9ToiXfgXEyMwFu4--Q"
        auth-url: "https://svupfnfszawowpkqhwdn.supabase.co/auth/v1/token"
        limit: "100"
        visa-confirmed-only: "true"
        delay-between-pages-ms: "400"
    - name: globalmove
      strategy: globalmove
      job-source: GLOBAL_MOVE
      discovery-source: GLOBAL_MOVE
      url: "https://globalmove.relocate.me/jobs"
      frequency-hours: 12 # informational only
      max-results: 300
      visa-exempt: true
      config:
        delay-between-pages-ms: "800"

globalmove:
  keepalive-schedule: "0 0 * * * ?"

server:
  port: 8089

logging:
  level:
    dev.jobhunter: DEBUG
    org.springframework.web.reactive: INFO
